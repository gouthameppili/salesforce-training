<template>

    <lightning-card title="Eligible Jobs">

        <div class="slds-p-around_medium">

            <!-- Loading State -->
            <template lwc:if={isLoading}>

                <lightning-spinner
                    alternative-text="Loading jobs">
                </lightning-spinner>

            </template>


            <!-- Error State -->
            <template lwc:if={errorMessage}>

                <div class="slds-text-color_error slds-m-bottom_medium">
                    {errorMessage}
                </div>

            </template>


            <!-- Student Selection -->
            <lightning-combobox
                label="Select Student"
                placeholder="Select a student"
                options={studentOptions}
                value={selectedStudentId}
                onchange={handleStudentChange}
                required>
            </lightning-combobox>


            <!-- Jobs -->
            <template lwc:if={hasJobs}>

                <div class="slds-m-top_medium">

                    <template for:each={jobs} for:item="job">

                        <c-job-card
                            key={job.Id}
                            job={job}
                            onapply={handleApply}>
                        </c-job-card>

                    </template>

                </div>

            </template>


            <!-- Empty State -->
            <template lwc:else>

                <c-empty-state
                    title="No Jobs Available"
                    message="There are currently no jobs available.">
                </c-empty-state>

            </template>


            <!-- Saving State -->
            <template lwc:if={isSaving}>

                <div class="slds-m-top_medium">

                    <lightning-spinner
                        alternative-text="Submitting application"
                        size="small">
                    </lightning-spinner>

                </div>

            </template>


            <!-- Application Result -->
            <template lwc:if={applicationMessage}>

                <div class="slds-m-top_medium slds-p-around_medium">

                    <p>{applicationMessage}</p>

                </div>

            </template>

        </div>

    </lightning-card>

</template>
