<template>

    <lightning-card title={dashboardTitle}>

        <div class="slds-p-around_medium">

            <h2>{welcomeMessage}</h2>

            <br>

            <p>Total Companies : {companyCount}</p>

            <p>Total Jobs : {jobCount}</p>

            <p>Total Applications : {applicationCount}</p>

            <br>

            <lightning-button
                label="Refresh Dashboard"
                variant="brand"
                onclick={handleRefresh}>
            </lightning-button>

            <br><br>

            <lightning-input
                label="Search Job"
                placeholder="Enter job name..."
                onchange={handleSearch}>
            </lightning-input>

            <br>

            <p>You typed: {searchJob}</p>

            <br>

        <template lwc:if={hasJobs}>
            <p style="color:green;">
                ✅ Jobs Available
            </p>
        </template>

        <template lwc:else>
            <p style="color:red;">
                ❌ No Jobs Available
            </p>
        </template>

        </div>

    </lightning-card>

    <br>

    <h2>Available Jobs</h2>

    <template for:each={jobList} for:item="job">

        <div key={job.id}
            class="slds-box slds-m-bottom_small">

            {job.name}

        </div>

    </template>

    <br>

<h2 class="slds-text-heading_medium">
    Students
</h2>

    <template if:true={students}>

        <template for:each={students} for:item="student">

            <div
                key={student.Id}
                class="slds-box slds-m-bottom_small">

                <strong>{student.Name}</strong>

                <br>

                CGPA : {student.CGPA__c}

            </div>

        </template>

    </template>

    <br>

    <h2 class="slds-text-heading_medium">
        Jobs
    </h2>

    <template if:true={jobs}>

        <template for:each={jobs} for:item="job">

            <div
                key={job.Id}
                class="slds-box slds-m-bottom_small">

                <strong>{job.Name}</strong>

                <br>

                Minimum CGPA : {job.Minimum_CGPA__c}

                <br>

                Last Date : {job.Last_Date__c}

            </div>

        </template>

    </template>

</template>
