<template>

    <lightning-card title={dashboardTitle}>

        <div class="slds-p-around_medium">

            <h2>{welcomeMessage}</h2>

            <br>

            <p>Total Companies : {companyCount}</p>

            <p>Total Jobs : {jobCount}</p>

            <p>Total Applications : {applicationCount}</p>

            <br>

            <lightning-button
                label="Refresh Dashboard"
                variant="brand"
                onclick={handleRefresh}>
            </lightning-button>

            <br><br>

            <lightning-input
                label="Search Job"
                placeholder="Enter job or company name..."
                value={searchJob}
                onchange={handleSearch}>
            </lightning-input>

            <br>

            <template lwc:if={hasJobs}>

                <p style="color:green;">
                    ✅ Jobs Available
                </p>

            </template>

            <template lwc:else>

                <p style="color:red;">
                    ❌ No Jobs Available
                </p>

            </template>

        </div>

    </lightning-card>


    <br>


    <!-- Available Jobs -->

    <h2 class="slds-text-heading_medium slds-p-left_small">
        Available Jobs
    </h2>


    <template lwc:if={hasJobs}>

        <template
            for:each={filteredJobs}
            for:item="job">

            <div
                key={job.Id}
                class="slds-box slds-m-around_small">

                <strong>{job.Name}</strong>

                <br>

                Company : {job.Company__c}

                <br>

                Minimum CGPA : {job.Minimum_CGPA__c}

                <br>

                Last Date : {job.Last_Date__c}

            </div>

        </template>

    </template>


    <template lwc:else>

        <div class="slds-p-around_medium">

            No matching jobs found.

        </div>

    </template>


    <br>


    <!-- Students -->

    <h2 class="slds-text-heading_medium slds-p-left_small">
        Students
    </h2>


    <template lwc:if={students}>

        <template
            for:each={students}
            for:item="student">

            <div
                key={student.Id}
                class="slds-box slds-m-around_small">

                <strong>{student.Name}</strong>

                <br>

                CGPA : {student.CGPA__c}

            </div>

        </template>

    </template>

</template>
