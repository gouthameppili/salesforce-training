<template>

    <div class="slds-box slds-m-bottom_small">

        <template lwc:if={application}>

            <template lwc:if={application.Job__r}>

                <h2 class="slds-text-heading_medium">
                    {application.Job__r.Name}
                </h2>

            </template>

            <template lwc:else>

                <h2 class="slds-text-heading_medium">
                    Job Information Unavailable
                </h2>

            </template>


            <p>
                Application Date:
                {application.Application_Date__c}
            </p>

            <p>
                Status:
                {application.Status__c}
            </p>

        </template>

    </div>

</template>
